<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daniella & José · 12 March 2027</title>
    <meta
      name="description"
      content="We are getting married in Argentina. Everything you need for the weekend, and your RSVP."
    />
    <meta name="theme-color" content="#f6eee2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniella & José · 12 March 2027" />
    <meta property="og:description" content="We are getting married in Argentina. You are warmly invited." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300..700;1,300..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Pinyon+Script&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detects forms in the static HTML at deploy time. The real RSVP form
      is rendered by React, so this hidden copy registers the same fields with Netlify.
    -->
    <form name="rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="attending" />
      <input type="text" name="guests" />
      <input type="text" name="recovery" />
      <input type="text" name="shuttle" />
      <textarea name="message"></textarea>
      <input type="text" name="language" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
